<svg width="200" height="400" viewBox="0 0 200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect width="200" height="400" rx="12" fill="#FEF7FF"/>
    <!-- Icon -->
    <circle cx="100" cy="120" r="40" fill="#6750A4" fill-opacity="0.1"/>
    <path d="M100 100V125M100 140H100.01" stroke="#6750A4" stroke-width="8" stroke-linecap="round"/>

    <!-- Text -->
    <text x="100" y="190" text-anchor="middle" fill="#1C1B1F" font-family="sans-serif" font-size="14" font-weight="bold">Permission Required</text>
    <rect x="20" y="210" width="160" height="2" fill="#CAC4D0"/>
    <text x="20" y="235" fill="#49454F" font-family="sans-serif" font-size="10">
        <tspan x="100" text-anchor="middle" dy="0">This app needs access</tspan>
        <tspan x="100" text-anchor="middle" dy="14">to read notifications</tspan>
        <tspan x="100" text-anchor="middle" dy="14">from financial apps.</tspan>
    </text>

    <!-- Button -->
    <rect x="20" y="300" width="160" height="40" rx="20" fill="#6750A4"/>
    <text x="100" y="325" text-anchor="middle" fill="white" font-family="sans-serif" font-size="10" font-weight="bold">GRANT ACCESS</text>
</svg>
