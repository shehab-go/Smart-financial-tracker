name: Bug Report
description: File a report to help us improve the library
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen.
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction steps
      description: How do we trigger this bug?
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: android-version
    attributes:
      label: Android Version
      options:
        - Android 15 (API 35)
        - Android 14 (API 34)
        - Android 13 (API 33)
        - Android 12 (API 31/32)
        - Android 11 (API 30)
        - Android 10 (API 29)
        - Older
    validations:
      required: true
  - type: input
    id: library-version
    attributes:
      label: Library Version
      placeholder: e.g., 1.1.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logcat Output
      description: Please copy and paste relevant log output.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have enabled `FinancialTrackerClient.loggingEnabled = true` to debug.
          required: true
        - label: I am using the latest version of the library.
          required: true
