complexity:
  TooManyFunctions:
    active: true
    thresholdInFiles: 15
    thresholdInClasses: 15
    thresholdInInterfaces: 15
    thresholdInObjects: 15
    thresholdInEnums: 15
  LongMethod:
    active: true
    threshold: 60
  LargeClass:
    active: true
    threshold: 600

style:
  MaxLineLength:
    active: true
    maxLineLength: 140
  WildcardImport:
    active: true
    excludeImports:
      - 'kotlinx.android.synthetic.*'
  UnusedPrivateMember:
    active: true
    allowedNames: '(_|ignored|expected|serialVersionUID)'

naming:
  FunctionNaming:
    active: true
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*' # Relaxed for Compose
